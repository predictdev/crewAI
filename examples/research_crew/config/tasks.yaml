research_task:
  description: >
    {topic}에 대해 조사하라. 현재 연도는 {current_year}년이다.
    web_search 도구로 최근 1년 안의 자료를 우선 찾고, 여러 번 검색해 교차 확인하라.
    핵심 개념, 최근 동향, 주요 플레이어, 쟁점과 한계를 다뤄라.
  expected_output: >
    주제별로 묶은 핵심 사실 8~12개의 불릿 리스트.
    각 항목에 날짜, 확신도(높음/중간/낮음), 출처 URL을 표시한다.
  agent: researcher

writing_task:
  description: >
    리서치 결과를 바탕으로 {topic}에 대한 한국어 리포트 초안을 작성하라.
  expected_output: >
    제목, 요약, 3~5개 섹션, 결론, 참고 자료(출처 URL 목록)로 구성된 마크다운 리포트 초안.
  agent: writer

review_task:
  description: >
    초안을 리서치 결과와 대조해 검토하라. 사실 오류, 근거 없는 주장,
    어색한 문장을 고치고 최종본을 작성하라.
  expected_output: >
    수정이 반영된 최종 마크다운 리포트. 맨 끝에 "## 리뷰 노트" 섹션을 두고
    주요 수정 사항을 3~5개 불릿으로 정리한다. 코드 블록으로 감싸지 않는다.
  agent: reviewer
