<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Office 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1 class="logo">AI OFFICE</h1>
    <nav class="login-tabs" role="tablist">
      <button type="button" role="tab" data-view="login" class="active">로그인</button>
      <button type="button" role="tab" data-view="signup">회원가입</button>
    </nav>

    <form id="login-form" data-view="login">
      <label>휴대폰 번호
        <input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678" required>
      </label>
      <button type="button" id="code-btn" class="primary">인증번호 받기</button>
      <div id="code-box" hidden>
        <label>인증번호
          <input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6자리">
        </label>
        <button type="submit" class="primary">로그인</button>
      </div>
    </form>

    <form id="signup-form" data-view="signup" hidden>
      <label>이름 <input id="signup-name" maxlength="30" required></label>
      <label>휴대폰 번호
        <input id="signup-phone" type="tel" inputmode="numeric" placeholder="01012345678" required>
      </label>
      <label>메모 <small>(소속·가입 이유, 선택)</small>
        <input id="signup-note" maxlength="200">
      </label>
      <button type="submit" class="primary">가입 신청</button>
      <p class="login-note">관리자가 승인하면 문자로 알려 드립니다. 승인 뒤에 휴대폰 번호로 로그인할 수 있습니다.</p>
    </form>

    <p class="login-msg" id="msg" role="status"></p>
  </main>
  <script src="login.js"></script>
</body>
</html>
