<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">AI OFFICE</span><span class="mode" id="mode">IDLE</span></div>
    <div class="project">
      <select id="project" aria-label="사업 선택"></select>
      <button type="button" id="project-new" title="새 사업">＋</button>
      <button type="button" id="project-rename" title="사업 이름 바꾸기">✎</button>
      <button type="button" id="project-delete" title="사업 삭제">🗑</button>
    </div>
    <form class="run" id="order-form">
      <textarea id="instruction" rows="1" placeholder="팀장에게 업무 지시 (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
      <button type="submit" id="order-btn" class="primary">📨 지시</button>
    </form>
    <div class="replay">
      <select id="recording" aria-label="녹화 선택"></select>
      <select id="speed" aria-label="재생 속도">
        <option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option>
      </select>
      <button type="button" id="replay-btn">⟲ 재생</button>
    </div>
    <button type="button" id="stop-btn" class="danger" hidden>■ 중지</button>
    <div class="conn" id="conn"><span class="dot"></span><span>연결 중</span></div>
  </header>

  <p class="hint" id="hint" hidden></p>
  <p class="hint info" id="flash" hidden></p>
  <p class="hint info" id="away" hidden></p>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="office" class="active">🏢 Office</button>
    <button role="tab" data-tab="tasks">📋 업무 <span class="badge" id="tasks-badge">0</span></button>
    <button role="tab" data-tab="report">📄 Report <span class="badge new" id="report-badge" hidden>NEW</span></button>
    <button type="button" id="edit-btn" class="edit-btn">🛠 팀 편집</button>
  </nav>

  <main>
    <section class="panel active" data-panel="office">
      <div class="stats">
        <div class="stat"><span>STAFF</span><b id="stat-staff">0</b></div>
        <div class="stat"><span>WORKING</span><b id="stat-working">0</b></div>
        <div class="stat"><span>IN PROGRESS</span><b id="stat-progress">0</b></div>
        <div class="stat"><span>DONE</span><b id="stat-done">0/0</b></div>
        <div class="stat"><span>TIME</span><b id="stat-time">00:00</b></div>
      </div>
      <div class="office-layout">
        <div class="stage" id="stage">
          <canvas id="office" width="384" height="232"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
        <aside class="side">
          <div class="feed" id="feed-box">
            <h2>ACTIVITY</h2>
            <ol id="feed"></ol>
          </div>
          <div class="editor" id="editor" hidden>
            <div class="editor-top">
              <h2>TEAM</h2>
              <span class="editor-state" id="editor-state">저장됨</span>
            </div>
            <p class="editor-note">캐릭터를 끌어 자리를 바꾸고, 클릭해서 설정을 고칩니다. 팀원을 다른 방으로 끌면 그 팀으로 옮겨 가고, 팀장석으로 끌면 그 사람이 팀장이 됩니다(역할 설정은 자리에 남음). 글에 <code>{topic}</code>(업무 지시 내용), <code>{current_year}</code>를 쓸 수 있습니다.</p>
            <div id="editor-fields"></div>
            <p class="editor-msg" id="editor-msg"></p>
            <div class="editor-actions">
              <button type="button" id="editor-save" class="primary" disabled>💾 저장</button>
              <button type="button" id="editor-revert" disabled>↺ 되돌리기</button>
              <button type="button" id="editor-default">기본 구성</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <section class="panel" data-panel="tasks">
      <div id="task-list" class="task-list"></div>
    </section>

    <section class="panel" data-panel="report">
      <div class="report-bar">
        <span id="report-meta"></span>
        <button type="button" id="download-btn" disabled>⬇ .md 저장</button>
      </div>
      <article id="report" class="report"><p class="empty">리포트가 완성되면 여기에 표시됩니다.</p></article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="sprites.js"></script>
  <script src="office.js"></script>
</body>
</html>
